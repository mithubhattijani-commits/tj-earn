# CircleCI — free APK builds for tj-earn (GitHub Actions minutes exhausted).
# Mirrors .github/workflows/build-apk.yml. Triggers on push to main.
# Required CircleCI project env vars: KEYSTORE_BASE64, KEYSTORE_STORE_PASSWORD,
# KEYSTORE_KEY_PASSWORD, SUPABASE_ANON_KEY, GH_TOKEN.
version: 2.1

jobs:
  build-apk:
    docker:
      - image: cirrusci/flutter:stable
    working_directory: ~/repo
    steps:
      - checkout
      - run:
          name: Flutter pub get
          command: flutter pub get
      - run:
          name: Analyze
          command: flutter analyze
      - run:
          name: Test
          command: flutter test
      - run:
          name: Decode signing keystore
          command: |
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/tjearn.keystore
            ls -lh android/app/tjearn.keystore
      - run:
          name: Build release APK (keystore-signed)
          command: |
            flutter build apk --release \
              --dart-define=SUPABASE_URL=https://znyaxxkhhopdqrvxhxmb.supabase.co \
              --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          no_output_timeout: 30m
      - run:
          name: Verify APK
          command: |
            ls -la build/app/outputs/flutter-apk/app-release.apk
            unzip -t build/app/outputs/flutter-apk/app-release.apk | tail -3
      - run:
          name: Install GitHub CLI
          command: |
            if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo"; fi
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | $SUDO dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            $SUDO chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | $SUDO tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            $SUDO apt-get update -qq
            $SUDO apt-get install -y -qq gh
      - run:
          name: Upload APK to GitHub Release
          command: |
            gh release create latest --title "Latest Build" --notes "Automated CircleCI build from $CIRCLE_SHA1" --repo mithubhattijani-commits/tj-earn 2>/dev/null || true
            gh release upload latest build/app/outputs/flutter-apk/app-release.apk --clobber --repo mithubhattijani-commits/tj-earn
      - store_artifacts:
          path: build/app/outputs/flutter-apk/app-release.apk

workflows:
  build-on-main:
    jobs:
      - build-apk:
          filters:
            branches:
              only: main
