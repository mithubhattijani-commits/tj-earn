name: tj_earn
description: "TJ Earn - rewards app (Flutter + Supabase). Stage 1 foundation: auth, server-side wallet, withdrawals, in-app updater."
publish_to: 'none'

# v1.0.25+26 (compliant model, 17 Nov 2026): rewarded ads removed —
# cash comes only from reading/check-in/referrals (Unity ticket
# #00945584). versionCode 26 is higher than the live v1.0.24/vc25, so the
# updater prompts users to update.
version: 1.0.26+27

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  supabase_flutter: ^2.9.0
  unity_ads_plugin: ^0.5.0
  webview_flutter: ^4.8.0
  http: ^1.3.0
  path_provider: ^2.1.5
  package_info_plus: ^8.3.0
  shared_preferences: ^2.3.3
  share_plus: ^10.1.4
  device_info_plus: ^11.3.0
  crypto: ^3.0.6
  url_launcher: ^6.2.5
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  app_links: ^6.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/jaani_ad_banner.jpg
