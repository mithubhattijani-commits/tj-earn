name: tj_earn
description: "TJ Earn - rewards app (Flutter + Supabase). Stage 1 foundation: auth, server-side wallet, withdrawals, in-app updater."
publish_to: 'none'

# v1.0.33+34 (TJ Racing loading-stuck fix, 20 Nov 2026 — user order):
# v1.0.32 stuck at LOADING 1% on device. Root causes (proven in Editor):
# splash bar never set Image.Type.Filled; activeInputHandler -1 (Input
# System package) with all-legacy input — taps could never register;
# Arial.ttf no longer a built-in font; com.unity.ugui missing. Fix:
# Filled bar, legacy input, LegacyRuntime.ttf, uGUI, 8 s stall + retry,
# async race setup, AudioListener, menu_ready/loading_progress events,
# Flutter 8 s watchdog + RETRY/BACK overlay, procedural sounds
# (engine/brake/dramatic music). versionCode 34 is higher than the
# live v1.0.32/vc33, so the updater prompts users to update.
version: 1.0.33+34

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  supabase_flutter: ^2.9.0
  unity_ads_plugin: ^0.5.0
  # TJ Racing 3D (v1.0.31): Unity-as-a-Library embed. flutter_embed_unity
  # ^2.0.0 supports Unity 2022.3 LTS and 6000.0/6000.3 LTS; the
  # flutter_embed_unity_2022_3_android override pins the Android
  # implementation to Unity 2022.3 (per the package changelog migration:
  # the 6000.0 Android package is now the default, so 2022.3 needs the
  # explicit override). Resolved 19 Nov 2026: flutter_embed_unity 2.0.0
  # + flutter_embed_unity_2022_3_android 2.0.0 (the 1.x android line
  # is incompatible with flutter_embed_unity 2.x — pub solver
  # requires the 2.0.0 android package). Pinned Unity version: 2022.3.62f2 or newer
  # (plugin requirement — security advisory; also satisfies the Android
  # 15 16KB page-size rule, which needs 2022.3.56+). Flutter 3.47.8
  # satisfies the plugin's Flutter >= 3.35 requirement. The Unity
  # export (unityLibrary) is NOT in the repo yet — see
  # android/unityLibrary/PLACEHOLDER_README.md; until it lands, a
  # release build cannot link, but analyzer + tests run clean.
  flutter_embed_unity: ^2.0.0
  flutter_embed_unity_2022_3_android: ^2.0.0
  webview_flutter: ^4.8.0
  http: ^1.3.0
  path_provider: ^2.1.5
  package_info_plus: ^8.3.0
  shared_preferences: ^2.3.3
  share_plus: ^10.1.4
  device_info_plus: ^11.3.0
  crypto: ^3.0.6
  url_launcher: ^6.2.5
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  app_links: ^6.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/jaani_ad_banner.jpg
