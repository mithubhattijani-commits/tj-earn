name: Build TJ Earn APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download unityLibrary (TJ Racing Unity export)
        run: |
          curl -sL -o unityLibrary.zip https://github.com/mithubhattijani-commits/tj-racing/releases/download/unityLibrary-v1.0.31/unityLibrary.zip
          echo "c62f635b62b4daf97c73df9ed5547cb57be07a8463eae63d5530d803ca0770c0  unityLibrary.zip" | sha256sum -c -
          unzip -o unityLibrary.zip -d android/
          rm -f android/unityLibrary/PLACEHOLDER_README.md
          test -f android/unityLibrary/build.gradle
          test -f android/unityLibrary/src/main/AndroidManifest.xml

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.47.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/tjearn.keystore

      - name: Build release APK (keystore-signed)
        env:
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: flutter build apk --release --dart-define=SUPABASE_URL=https://znyaxxkhhopdqrvxhxmb.supabase.co --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Verify APK
        run: |
          ls -la build/app/outputs/flutter-apk/app-release.apk
          unzip -t build/app/outputs/flutter-apk/app-release.apk | tail -3
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAPT2=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/aapt2 | head -1)
          APKSIGNER=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | head -1)
          "$AAPT2" dump badging "$APK" | grep -F "package: name='com.tjearn.app'"
          EXPECTED_VC=$(grep -E '^version:' pubspec.yaml | sed 's/.*+//')
          EXPECTED_VN=$(grep -E '^version:' pubspec.yaml | sed 's/^version: //; s/+.*//')
          "$AAPT2" dump badging "$APK" | grep -F "versionCode='$EXPECTED_VC'"
          "$AAPT2" dump badging "$APK" | grep -F "versionName='$EXPECTED_VN'"
          "$APKSIGNER" verify --print-certs "$APK" | tee certs.txt
          ACTUAL_DIGEST=$(grep "Signer #1 certificate SHA-256 digest" certs.txt | awk '{print $NF}' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          if [ "$ACTUAL_DIGEST" != "b58d8a8810080c111f11f7a81dd36db0f2587d1d6a4f7752632ef82a295ca7df" ]; then echo "SIGNER MISMATCH: got $ACTUAL_DIGEST"; exit 1; fi
          echo "VERIFY OK: signer matches TJ Earn day-1 key"

      - name: Upload APK to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest --title "Latest Build" --notes "Automated build from ${{ github.sha }}" 2>/dev/null || true
          gh release upload latest build/app/outputs/flutter-apk/app-release.apk --clobber
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
